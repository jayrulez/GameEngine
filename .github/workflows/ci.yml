name: CI

# Build + test on every master push / PR: Linux clang Debug, Linux clang Debug with
# SHARED engine libraries (the .so lane), Linux gcc Debug (the house battery is BOTH
# compilers), and Windows MSVC Debug (D3D12 + WebGPU coverage).
# Release distribution lives in release.yml. Peak-memory notes: a single modules TU
# can need several GB; the swapfile step is OOM insurance, and lavapipe (software
# Vulkan) lets device-creating tests run headless.

permissions:
  contents: read # build + test only; nothing here publishes

on:
  push:
    branches: [master]
    paths-ignore: ['**/*.md', 'Documentation/**', 'comments-cleanup.md']
  pull_request:
    branches: [master]
    paths-ignore: ['**/*.md', 'Documentation/**', 'comments-cleanup.md']
  workflow_dispatch: {}

# Supersede an in-flight run for the same ref (saves minutes on a private repo).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-clang:
    name: Linux / clang / Debug
    runs-on: ubuntu-24.04
    timeout-minutes: 180 # a cold modules build is slow; the cache warms subsequent runs
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: '4' # lower to 2 (or 1) if the modules build OOMs
    steps:
      - uses: actions/checkout@v7

      # The C++23-modules build writes a large volume of .pcm + object files and can exhaust the
      # runner's root disk (the previous run died at ~87% with "No space left on device"). Reclaim
      # the ~20-25 GB of preinstalled toolchains we do not use (Android SDK, .NET, GHC, CodeQL,
      # Swift, PowerShell) before building. df prints before/after so the headroom is visible.
      - name: Free up disk space
        run: |
          df -h /
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup \
                      /opt/hostedtoolcache/CodeQL /usr/share/swift /usr/local/share/powershell
          sudo apt-get clean
          df -h /

      # Build + runtime deps (mirrors README "Ubuntu / Debian"). mesa-vulkan-drivers
      # gives lavapipe (software Vulkan) so device-creating tests can run headless.
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build clang pkg-config xvfb \
            libvulkan-dev vulkan-tools vulkan-validationlayers mesa-vulkan-drivers \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxss-dev \
            libxtst-dev libwayland-dev wayland-protocols libxkbcommon-dev libasound2-dev
          cmake --version

      # Ubuntu 24.04 ships Clang 18, but the codebase targets a current Clang (the dev toolchain
      # is 21) - e.g. -Wno-c2y-extensions is unknown to Clang 18 and, under -Werror, fails the
      # build, and Clang 18's C++23-modules support is weaker. Install Clang 21 from apt.llvm.org;
      # the Configure step selects the versioned clang++-21 binary explicitly (see there).
      - name: Install Clang 21 (match the dev toolchain)
        run: |
          wget -qO /tmp/llvm.sh https://apt.llvm.org/llvm.sh
          chmod +x /tmp/llvm.sh
          sudo /tmp/llvm.sh 21
          clang++-21 --version   # fail loudly here if the install did not produce the binary

      # SDL3 is vendored as source (ThirdParty/SDL3) and built statically in-tree, so there is no
      # SDL to install here - only its build deps (the X11/Wayland/audio -dev packages above),
      # which the source build compiles against.

      # OOM insurance for the memory-heavy modules build: a large swapfile means a
      # spike gets paged instead of OOM-killed (slower, but the job survives). The runner
      # already ships an active /swapfile, so disable and remove it first (fallocate on the
      # in-use file fails "Text file busy"), then create the larger one on the roomy /mnt disk.
      - name: Add swap headroom
        run: |
          sudo swapoff -a || true
          sudo rm -f /swapfile /mnt/swapfile
          sudo fallocate -l 12G /mnt/swapfile
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile
          free -h

      # NO ccache: it does not hash the module BMIs behind CMake's @modmap files, so an
      # interface (.cppm) change gets importer TUs served as stale cached objects - a silent
      # ABI/constant mismatch (bit locally 2026-08-30, then this lane on the facade-count
      # bump). Re-adding it would need a launcher scoped to non-module TUs only (ThirdParty).
      - name: Configure
        # Override the preset's CMAKE_CXX_COMPILER ('clang++') with the versioned Clang 21 binary.
        # A command-line -D beats the preset cache var (and beats CC/CXX env), so this does not
        # depend on update-alternatives having repointed /usr/bin/clang++. ASM uses the CXX driver.
        run: >
          cmake --preset clang
          -DCMAKE_C_COMPILER=clang-21
          -DCMAKE_CXX_COMPILER=clang++-21
          -DCMAKE_ASM_COMPILER=clang++-21

      - name: Build
        run: cmake --build --preset clang

      # Run the doctest suites under a virtual X server; VK_ICD points the loader at
      # lavapipe so any test that creates a real Vulkan device works without a GPU.
      # --timeout bounds any single suite (all run in seconds) so a hang fails that test fast
      # instead of blocking the whole job until the 180-minute job timeout.
      - name: Test
        env:
          VK_ICD_FILENAMES: /usr/share/vulkan/icd.d/lvp_icd.x86_64.json
        run: xvfb-run -a ctest --preset clang --output-on-failure --timeout 300 --no-tests=error

      # Cook the REAL shader corpus the way an export or an editor dist does (WGSL via naga +
      # SPIR-V via DXC, every declared variant, the used-but-undeclared drift lint). Without
      # this a shader that only breaks at cook time is first seen at export. The pack goes to
      # the runner's temp dir - never into Data/ (the dev tree compiles sources).
      - name: Cook the shader pack
        run: Bin/Debug/Linux64-Clang/Tools.ShaderPack Data/Shaders "$RUNNER_TEMP/shaders.dpak" wgsl spirv

  # The SHARED-ENGINE lane (Documentation/Specs/shared-libraries.md): the same clang
  # battery with ENGINE_SHARED_LIBS=ON - 179 .so files, and the suites (incl. the
  # cross-boundary plugin case, which only exists in this lane) run across real
  # dlopen boundaries. Identity + rendezvous regressions that a static build hides
  # fail here.
  linux-clang-shared:
    name: Linux / clang / Debug / shared libraries
    runs-on: ubuntu-24.04
    timeout-minutes: 180 # a cold modules build is slow; the cache warms subsequent runs
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: '4' # lower to 2 (or 1) if the modules build OOMs
    steps:
      - uses: actions/checkout@v7

      # The C++23-modules build writes a large volume of .pcm + object files and can exhaust the
      # runner's root disk (the previous run died at ~87% with "No space left on device"). Reclaim
      # the ~20-25 GB of preinstalled toolchains we do not use (Android SDK, .NET, GHC, CodeQL,
      # Swift, PowerShell) before building. df prints before/after so the headroom is visible.
      - name: Free up disk space
        run: |
          df -h /
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup \
                      /opt/hostedtoolcache/CodeQL /usr/share/swift /usr/local/share/powershell
          sudo apt-get clean
          df -h /

      # Build + runtime deps (mirrors README "Ubuntu / Debian"). mesa-vulkan-drivers
      # gives lavapipe (software Vulkan) so device-creating tests can run headless.
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build clang pkg-config xvfb \
            libvulkan-dev vulkan-tools vulkan-validationlayers mesa-vulkan-drivers \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxss-dev \
            libxtst-dev libwayland-dev wayland-protocols libxkbcommon-dev libasound2-dev
          cmake --version

      # Ubuntu 24.04 ships Clang 18, but the codebase targets a current Clang (the dev toolchain
      # is 21) - e.g. -Wno-c2y-extensions is unknown to Clang 18 and, under -Werror, fails the
      # build, and Clang 18's C++23-modules support is weaker. Install Clang 21 from apt.llvm.org;
      # the Configure step selects the versioned clang++-21 binary explicitly (see there).
      - name: Install Clang 21 (match the dev toolchain)
        run: |
          wget -qO /tmp/llvm.sh https://apt.llvm.org/llvm.sh
          chmod +x /tmp/llvm.sh
          sudo /tmp/llvm.sh 21
          clang++-21 --version   # fail loudly here if the install did not produce the binary

      # SDL3 is vendored as source (ThirdParty/SDL3) and built statically in-tree, so there is no
      # SDL to install here - only its build deps (the X11/Wayland/audio -dev packages above),
      # which the source build compiles against.

      # OOM insurance for the memory-heavy modules build: a large swapfile means a
      # spike gets paged instead of OOM-killed (slower, but the job survives). The runner
      # already ships an active /swapfile, so disable and remove it first (fallocate on the
      # in-use file fails "Text file busy"), then create the larger one on the roomy /mnt disk.
      - name: Add swap headroom
        run: |
          sudo swapoff -a || true
          sudo rm -f /swapfile /mnt/swapfile
          sudo fallocate -l 12G /mnt/swapfile
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile
          free -h

      # NO ccache: it does not hash the module BMIs behind CMake's @modmap files, so an
      # interface (.cppm) change gets importer TUs served as stale cached objects - a silent
      # ABI/constant mismatch (bit locally 2026-08-30, then this lane on the facade-count
      # bump). Re-adding it would need a launcher scoped to non-module TUs only (ThirdParty).
      - name: Configure
        # Override the preset's CMAKE_CXX_COMPILER ('clang++') with the versioned Clang 21 binary.
        # A command-line -D beats the preset cache var (and beats CC/CXX env), so this does not
        # depend on update-alternatives having repointed /usr/bin/clang++. ASM uses the CXX driver.
        run: >
          cmake --preset clang-shared
          -DCMAKE_C_COMPILER=clang-21
          -DCMAKE_CXX_COMPILER=clang++-21
          -DCMAKE_ASM_COMPILER=clang++-21

      - name: Build
        run: cmake --build --preset clang-shared

      # Run the doctest suites under a virtual X server; VK_ICD points the loader at
      # lavapipe so any test that creates a real Vulkan device works without a GPU.
      # --timeout bounds any single suite (all run in seconds) so a hang fails that test fast
      # instead of blocking the whole job until the 180-minute job timeout.
      - name: Test
        env:
          VK_ICD_FILENAMES: /usr/share/vulkan/icd.d/lvp_icd.x86_64.json
        run: xvfb-run -a ctest --preset clang-shared --output-on-failure --timeout 300 --no-tests=error

  linux-gcc:
    name: Linux / gcc / Debug
    runs-on: ubuntu-24.04
    # Ubuntu 26.04's g++-15 (15.2.0-16ubuntu1) is the dev toolchain and the only GCC that
    # builds this codebase today: upstream 15.2.0 release cannot resolve transitive CMIs
    # from CMake's direct-imports-only module maps ("failed to read compiled module: Bad
    # import dependency"), and the toolchain-r noble backport miscompiles module interfaces
    # (defaulted constructors diagnosed as overloading themselves). Ubuntu's own 26.04 LTS
    # package carries both branch fixes, so the job runs in that container.
    container:
      image: ubuntu:26.04
      volumes:
        - /mnt:/mnt # the roomy disk: object/module output lives here (the host disk-reclaim
                    # step cannot run inside a container, and the modules build is disk-hungry)
    timeout-minutes: 180
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: '2' # a container job cannot add swap headroom; stay low
    steps:
      - uses: actions/checkout@v7
      - name: Install dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            cmake ninja-build g++-15 pkg-config xvfb ca-certificates \
            libvulkan-dev vulkan-tools vulkan-validationlayers mesa-vulkan-drivers \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxss-dev \
            libxtst-dev libwayland-dev wayland-protocols libxkbcommon-dev libasound2-dev
          g++-15 --version
      - name: Configure
        # Not the preset: the build dir must live on the /mnt volume (see above), and the
        # preset pins binaryDir. Cache variables mirror the gcc preset.
        run: >
          cmake -S . -B /mnt/build-gcc -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_C_COMPILER=gcc-15
          -DCMAKE_CXX_COMPILER=g++-15
      - name: Build
        run: cmake --build /mnt/build-gcc -j2 -- -k 0
      - name: Test
        env:
          VK_ICD_FILENAMES: /usr/share/vulkan/icd.d/lvp_icd.x86_64.json
        run: xvfb-run -a ctest --test-dir /mnt/build-gcc --output-on-failure --timeout 300 --no-tests=error

  # Windows build + test with MSVC. This covers the D3D12 backend (which the Linux job cannot
  # exercise) plus WebGPU and the headless/logic suites. No Vulkan SDK is installed, so
  # find_package(Vulkan) fails and RHI.Vulkan + the Vulkan-only Render.Backend.Tests are skipped by
  # design (Vulkan is the Linux job's coverage). SDL3 is vendored source and builds static in-tree,
  # and DXC/wgpu ship as Windows prebuilts in ThirdParty - so there is nothing to install beyond the
  # toolchain. Independent of the Linux job; a Windows failure does not cancel Linux.
  windows-msvc:
    name: Windows / MSVC / Debug
    runs-on: windows-latest
    timeout-minutes: 180
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: '4' # lower to 2 if the modules build OOMs on the 16 GB runner
    steps:
      - uses: actions/checkout@v7
      - uses: ilammy/msvc-dev-cmd@v1 # puts cl + the Windows SDK on PATH for the later steps
      - name: Install Ninja
        run: choco install ninja -y # the msvc preset uses the Ninja generator (C++20 modules)
      - name: Configure
        run: cmake --preset msvc
      - name: Build
        run: cmake --build --preset msvc
      # Device-creating suites run against whatever headless adapter Windows provides (D3D12 WARP);
      # ones with no software path skip themselves. --timeout bounds any hang.
      - name: Test
        run: ctest --preset msvc --output-on-failure --timeout 300 --no-tests=error

  # The Windows half of the shared-library lane. PE has no vague-linkage interposition,
  # so this job catches identity/rendezvous regressions that BOTH the static builds and
  # (until a template is COMPILER_ATTR_HIDDEN) the Linux shared lane hide - it is where
  # the W1 TypeOf<T> slot regression would surface first. Also the only lane exercising
  # the generated module-aware .def export path (cmake/GenerateModuleDef.cmake) and
  # Runtime.CrossPlugin across a real LoadLibraryW boundary.
  # shared-libraries.md P5/W2.
  windows-msvc-shared:
    name: Windows / MSVC / Debug / shared libraries
    runs-on: windows-latest
    timeout-minutes: 180
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: '4' # lower to 2 if the modules build OOMs on the 16 GB runner
    steps:
      - uses: actions/checkout@v7
      - uses: ilammy/msvc-dev-cmd@v1 # puts cl + the Windows SDK on PATH for the later steps
      - name: Install Ninja
        run: choco install ninja -y # the msvc-shared preset uses the Ninja generator (C++20 modules)
      - name: Configure
        run: cmake --preset msvc-shared
      - name: Build
        run: cmake --build --preset msvc-shared
      # Executables and their engine DLLs share Bin/Debug/Win64-MSVC-Shared, so the loader
      # finds them next to the exe with no PATH setup; import libs live in that dir's lib/.
      - name: Test
        run: ctest --preset msvc-shared --output-on-failure --timeout 300 --no-tests=error
  
  # Debug builds are intentionally kept for build/test coverage, but their build
  # directories are not uploaded because they are very large (1.4-2.2 GB).
  # Instead, CI produces the packaged editor + deployment templates (RelWithDebInfo, symbols split off) using
  # the same distribution scripts as release.yml, so PRs have small downloadable builds for testing.
  linux-release:
    name: Linux / Release distribution
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    permissions:
      contents: read
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: '4'

    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build clang pkg-config \
            libvulkan-dev vulkan-tools mesa-vulkan-drivers \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxss-dev \
            libxtst-dev libwayland-dev wayland-protocols libxkbcommon-dev libasound2-dev

      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force || true

      - name: Install Clang 21
        run: |
          wget -qO /tmp/llvm.sh https://apt.llvm.org/llvm.sh
          chmod +x /tmp/llvm.sh
          sudo /tmp/llvm.sh 21

      - name: Add swap headroom
        run: |
          sudo swapoff -a || true
          sudo rm -f /swapfile /mnt/swapfile
          sudo fallocate -l 12G /mnt/swapfile
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile

      - name: Build editor distribution
        run: |
          CXX_COMPILER=clang++-21 \
          C_COMPILER=clang-21 \
          OUT=dist/Editor-Linux64 \
          scripts/build-editor-dist.sh

      - name: Build deployment template
        run: |
          CXX_COMPILER=clang++-21 \
          C_COMPILER=clang-21 \
          OUT=dist/templates \
          scripts/build-export-templates.sh linux

      - name: Package deployment template
        run: |
          VERSION="$(grep -oP '^\s*VERSION\s+\K[0-9]+\.[0-9]+\.[0-9]+' CMakeLists.txt | head -1)"
          tar -czf \
            "dist/DeploymentTemplate-${VERSION}-Linux64.tar.gz" \
            -C dist/templates \
            linux64-release
          tar -czf \
            "dist/DeploymentTemplate-${VERSION}-Linux64-symbols.tar.gz" \
            -C dist/templates \
            linux64-release-symbols

      - name: Upload Linux release build
        uses: actions/upload-artifact@v7
        with:
          name: linux-release
          path: |
            dist/Editor-*-Linux64.tar.gz
            dist/Editor-*-Linux64-symbols.tar.gz
            dist/DeploymentTemplate-*-Linux64.tar.gz
            dist/DeploymentTemplate-*-Linux64-symbols.tar.gz
          if-no-files-found: error
          retention-days: 1
    
  windows-release:
    name: Windows / Release distribution
    runs-on: windows-latest
    timeout-minutes: 180
    permissions:
      contents: read
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: '4'

    steps:
      - uses: actions/checkout@v7

      - uses: ilammy/msvc-dev-cmd@v1

      - name: Install Ninja
        run: choco install ninja -y

      - name: Build editor distribution
        run: pwsh scripts/build-editor-dist.ps1 -Out dist/Editor-Win64

      - name: Build deployment template
        shell: pwsh
        run: |
          $cmake = Get-Content CMakeLists.txt -Raw
          $Version = if ($cmake -match 'project\(\s*GameEngine\s+VERSION\s+([0-9]+\.[0-9]+\.[0-9]+)') {
            $Matches[1]
          } else {
            throw "Could not determine project version"
          }

          pwsh scripts/build-export-templates.ps1 -Out dist/templates

          Compress-Archive `
            -Path dist/templates/win64-release `
            -DestinationPath "dist/DeploymentTemplate-$Version-Win64.zip"

          Compress-Archive `
            -Path dist/templates/win64-release-symbols `
            -DestinationPath "dist/DeploymentTemplate-$Version-Win64-symbols.zip"

      - name: Upload Windows release build
        uses: actions/upload-artifact@v7
        with:
          name: windows-release
          path: |
            dist/Editor-*-Win64.zip
            dist/Editor-*-Win64-symbols.zip
            dist/DeploymentTemplate-*-Win64.zip
            dist/DeploymentTemplate-*-Win64-symbols.zip
          if-no-files-found: error
          retention-days: 1