name: Release

# Editor distribution is cut ONLY from the 'release' branch. Flow: land release-ready code on
# 'release', then push a version tag (e.g. v0.1.0) that points at a commit on 'release'. This
# builds the editor dist per platform and publishes a GitHub Release with the archives attached.
# A tag that is NOT on 'release' is rejected by the guard job. The master/PR CI (ci.yml) never
# builds a dist - build+test there, release here.

on:
  push:
    tags: ['v*']

permissions:
  contents: read # default; the publishing jobs escalate to write individually

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Enforce "releases only from the release branch": the tagged commit must be on origin/release.
  guard:
    name: Verify the tag is on 'release'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reject a tag that is not on 'release'
        run: |
          git fetch --no-tags origin release
          if git merge-base --is-ancestor "$GITHUB_SHA" origin/release; then
            echo "ok: ${GITHUB_REF_NAME} ($GITHUB_SHA) is on origin/release"
          else
            echo "::error::Refusing to release: ${GITHUB_REF_NAME} is not on the 'release' branch. Cut the tag on 'release'."
            exit 1
          fi
      # The tag must match project(VERSION) in CMakeLists - the single source of truth the binary
      # reports and the dist archives are named with. Catches a tag pushed without the version bump.
      - name: Reject a tag that does not match project(VERSION)
        run: |
          VERSION="$(grep -oP '^\s*VERSION\s+\K[0-9]+\.[0-9]+\.[0-9]+' CMakeLists.txt | head -1)"
          if [ "${GITHUB_REF_NAME}" = "v${VERSION}" ]; then
            echo "ok: tag ${GITHUB_REF_NAME} matches project(VERSION) ${VERSION}"
          else
            echo "::error::Tag ${GITHUB_REF_NAME} does not match project(VERSION) v${VERSION}. Bump project(VERSION) in CMakeLists and tag v${VERSION}."
            exit 1
          fi

  linux:
    name: Editor dist (Linux x64)
    needs: guard
    runs-on: ubuntu-24.04
    permissions:
      contents: write # publishes release assets
    timeout-minutes: 180 # a cold release build is slow (no cache; releases are infrequent)
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: '4' # lower if the modules build OOMs
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build clang pkg-config \
            libvulkan-dev vulkan-tools mesa-vulkan-drivers \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxss-dev \
            libxtst-dev libwayland-dev wayland-protocols libxkbcommon-dev libasound2-dev
      # SDL3 is vendored as source and built statically in-tree (nothing to install here); the
      # X11/Wayland/audio -dev packages above are its build deps.
      - name: Free up disk space
        # The modules build fills the runner disk, and a release build writes even more
        # (Release config + editor + player + exporter). Reclaim unused preinstalled toolchains.
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force || true
      - name: Install Clang 21 (match the dev toolchain)
        # Stock Ubuntu 24.04 clang is 18: it lacks -Wno-c2y-extensions (passed under
        # -Werror) and its C++23-modules support is weaker. Install the dev toolchain's Clang.
        run: |
          wget -qO /tmp/llvm.sh https://apt.llvm.org/llvm.sh
          chmod +x /tmp/llvm.sh
          sudo /tmp/llvm.sh 21
      # The runner ships an active /swapfile; disable and remove it before creating a larger
      # one on the roomy /mnt disk (fallocate on the in-use /swapfile fails "Text file busy").
      - name: Add swap headroom
        run: |
          sudo swapoff -a || true
          sudo rm -f /swapfile /mnt/swapfile
          sudo fallocate -l 12G /mnt/swapfile && sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile && sudo swapon /mnt/swapfile
      # The AUTHORING TOOL (editor) - one downloadable package.
      - name: Build editor distribution
        run: CXX_COMPILER=clang++-21 C_COMPILER=clang-21 OUT=dist/Editor-Linux64 scripts/build-editor-dist.sh
      # The DEPLOYMENT TEMPLATE (game runtime: Engine.Player + sidecars + template.xml) - a SEPARATE
      # downloadable package a developer exports their game against. Reuses build/clang-reldbg from
      # the editor build above (adds Engine.Player + Tools.Export): both are RelWithDebInfo, so the
      # engine builds once. The Web template is a separate job below (needs emsdk).
      - name: Build deployment template (Linux runtime)
        run: |
          VERSION="$(grep -oP '^\s*VERSION\s+\K[0-9]+\.[0-9]+\.[0-9]+' CMakeLists.txt | head -1)"
          CXX_COMPILER=clang++-21 C_COMPILER=clang-21 OUT=dist/templates scripts/build-export-templates.sh linux
          tar -czf "dist/DeploymentTemplate-${VERSION}-Linux64.tar.gz" -C dist/templates linux64-release
          tar -czf "dist/DeploymentTemplate-${VERSION}-Linux64-symbols.tar.gz" -C dist/templates linux64-release-symbols
      - name: Publish to the GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          # Version-stamped names from build-editor-dist.sh + the template step (e.g.
          # Editor-0.1.0-Linux64.tar.gz); glob so the workflow tracks the version automatically.
          # The -symbols archives are the split debug info of the two downloads: a crash report
          # from either resolves against them.
          files: |
            dist/Editor-*-Linux64.tar.gz
            dist/Editor-*-Linux64-symbols.tar.gz
            dist/DeploymentTemplate-*-Linux64.tar.gz
            dist/DeploymentTemplate-*-Linux64-symbols.tar.gz
          fail_on_unmatched_files: true

  # The MSVC modules build is exercised by ci.yml on every push; the dist/template .ps1 packaging
  # steps here have not yet run on a Windows agent (release.yml fires only on a tag). This job is
  # independent of the Linux job, so a Windows failure does not block the Linux release (both attach
  # to the same tag's Release). Builds the editor dist AND the Windows deployment template.
  windows:
    name: Editor dist + template (Windows x64)
    needs: guard
    runs-on: windows-2022 # pinned so releases run on the same image CI exercises
    permissions:
      contents: write # publishes release assets
    timeout-minutes: 180
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: '4'
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1 # cl / clang-cl on PATH
      - name: Install Ninja
        # msvc-dev-cmd does not guarantee ninja on PATH; the configure below needs it.
        run: choco install ninja -y
      # The AUTHORING TOOL (editor) - one downloadable package.
      - name: Build editor distribution
        run: pwsh scripts/build-editor-dist.ps1 -Out dist/Editor-Win64
      # The DEPLOYMENT TEMPLATE (Windows game runtime: Engine.Player.exe + sidecars + template.xml) -
      # a SEPARATE downloadable package a developer exports a Windows game against, mirroring the
      # Linux/Web template jobs. Reuses build/msvc-reldbg from the editor build above (it adds
      # Engine.Player + Tools.Export): both are RelWithDebInfo, so the engine builds once.
      - name: Build deployment template (Windows runtime)
        shell: pwsh
        run: |
          $cmake = Get-Content CMakeLists.txt -Raw
          $Version = if ($cmake -match 'project\(\s*GameEngine\s+VERSION\s+([0-9]+\.[0-9]+\.[0-9]+)') { $Matches[1] } else { "0.0.0" }
          pwsh scripts/build-export-templates.ps1 -Out dist/templates
          Compress-Archive -Path dist/templates/win64-release -DestinationPath "dist/DeploymentTemplate-$Version-Win64.zip"
          Compress-Archive -Path dist/templates/win64-release-symbols -DestinationPath "dist/DeploymentTemplate-$Version-Win64-symbols.zip"
      - name: Publish to the GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/Editor-*-Win64.zip
            dist/Editor-*-Win64-symbols.zip
            dist/DeploymentTemplate-*-Win64.zip
            dist/DeploymentTemplate-*-Win64-symbols.zip
          fail_on_unmatched_files: true

  # Web deployment template (Emscripten/WebGPU game runtime: Engine.Player .js/.wasm + serve.py).
  # The emsdk version and the wasm build have not yet run on a hosted runner. The response-file
  # patch is WINDOWS-ONLY (a CreateProcess arg-length limit), so a Linux runner does not apply it.
  # build-export-templates.sh web also builds the NATIVE exporter first (Engine.Player +
  # Tools.Export), hence the full build deps here. This job is independent, so a failure does not
  # block the native releases.
  web:
    name: Deployment template (Web/Emscripten)
    needs: guard
    runs-on: ubuntu-24.04
    permissions:
      contents: write # publishes release assets
    timeout-minutes: 180
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: '4'
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build clang pkg-config \
            libvulkan-dev vulkan-tools mesa-vulkan-drivers \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxss-dev \
            libxtst-dev libwayland-dev wayland-protocols libxkbcommon-dev libasound2-dev
      # SDL3 is vendored as source and built statically in-tree by the native build that
      # build-export-templates.sh web runs first (Tools.Export + Engine.Player) - nothing to install
      # here; the X11/Wayland/audio -dev packages above are its build deps.
      - name: Free up disk space
        # The modules build fills the runner disk, and a release build writes even more
        # (Release config + editor + player + exporter). Reclaim unused preinstalled toolchains.
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force || true
      - name: Install Clang 21 (match the dev toolchain)
        # Stock Ubuntu 24.04 clang is 18: it lacks -Wno-c2y-extensions (passed under
        # -Werror) and its C++23-modules support is weaker. Install the dev toolchain's Clang.
        run: |
          wget -qO /tmp/llvm.sh https://apt.llvm.org/llvm.sh
          chmod +x /tmp/llvm.sh
          sudo /tmp/llvm.sh 21
      # The runner ships an active /swapfile; disable and remove it before creating a larger
      # one on the roomy /mnt disk (fallocate on the in-use /swapfile fails "Text file busy").
      - name: Add swap headroom
        run: |
          sudo swapoff -a || true
          sudo rm -f /swapfile /mnt/swapfile
          sudo fallocate -l 12G /mnt/swapfile && sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile && sudo swapon /mnt/swapfile
      - name: Set up emsdk (emscripten 6.0.5)
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 6.0.5
          actions-cache-folder: emsdk-cache
      - name: Configure the wasm build (Release)
        run: emcmake cmake -S . -B build/wasm-shipping -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Build web deployment template
        run: |
          VERSION="$(grep -oP '^\s*VERSION\s+\K[0-9]+\.[0-9]+\.[0-9]+' CMakeLists.txt | head -1)"
          OUT=dist/templates CXX_COMPILER=clang++-21 C_COMPILER=clang-21 scripts/build-export-templates.sh web
          tar -czf "dist/DeploymentTemplate-${VERSION}-Web.tar.gz" -C dist/templates web-release
      - name: Publish to the GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/DeploymentTemplate-*-Web.tar.gz
          fail_on_unmatched_files: true
